# TANMIA — one-click deployment from GitHub (no local installation needed).
# Repository → Settings → Secrets and variables → Actions → add:
#   SUPABASE_ACCESS_TOKEN   (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    (the project id in your Supabase URL)
#   VITE_SUPABASE_URL       (https://<ref>.supabase.co)
#   VITE_SUPABASE_ANON_KEY  (Project Settings → API → anon / publishable key — NOT service_role)
# Then: Actions → "TANMIA deploy" → Run workflow.
name: TANMIA deploy
on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy the 16 Edge Functions to Supabase
        type: boolean
        default: true
      build_website:
        description: Build the website (download tanmia-website.zip for Hostinger)
        type: boolean
        default: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tanmia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tanmia/package-lock.json
      - run: npm ci
      - name: Deploy Edge Functions
        if: ${{ inputs.deploy_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Build website
        if: ${{ inputs.build_website }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm test
          npm run build
          npm run verify:build
      - name: Upload website package
        if: ${{ inputs.build_website }}
        uses: actions/upload-artifact@v4
        with:
          name: tanmia-website
          path: tanmia/dist/
          include-hidden-files: true
